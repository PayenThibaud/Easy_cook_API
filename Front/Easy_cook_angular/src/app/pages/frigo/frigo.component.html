<button routerLink="/recettes" class="p-6 font-bold">Retour</button>
<div class="p-6">
    <form class="bg-slate-200 space-y-6 p-8 rounded-lg mx-auto" (ngSubmit)="submitIngredientForm()">
        <h1 class="text-center font-bold text-gray-900 text-2xl dark:text-white">Ajoutez des ingrédients à votre frigo</h1>
        <div>
            <label for="nom" class="block text-sm text-slate-700">Ajoutez le nom de l'ingrédient</label>
            <input type="number" id="nom" name="nom" class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-md" [(ngModel)]="alimentFrigo.id_aliment">
        </div>
        <div>
            <label for="quantite" class="block text-sm text-slate-700">Quantité</label>
            <input type="number" id="quantite" name="quantite" class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-md" [(ngModel)]="alimentFrigo.nombreAliment">
        </div>
        <button type="submit" class="mt-2 w-full py-3 px-6 bg-slate-600 text-white hover:bg-slate-400 rounded">Ajouter au frigo</button>
    </form>
</div>

<div class="relative overflow-x-auto p-6">
    <h1 class="text-center p-6 font-bold text-gray-900 text-2xl dark:text-white">DANS MON FRIGO</h1>
    <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
            <tr>
                <th scope="col" class="px-6 py-3">Nom de l'ingrédient</th>
                <th scope="col" class="px-6 py-3">Quantité(s)</th>
                <th scope="col" class="px-6 py-3">calories</th>
                <th scope="col" class="px-6 py-3">Modifier</th>
                <th scope="col" class="px-6 py-3">Supprimer</th>
            </tr>
        </thead>
        <tbody>
            <!-- <tr *ngFor="let ingredient of listIngredients" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700"> -->
                @for(ingredient of listIngredients; track ingredient; let i = $index ){
            <tr  class="bg-white border-b dark:bg-gray-800 dark:border-gray-700">
                <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">{{ ingredient.nom }}</td>
                <td class="px-6 py-4">{{ getIngredientQuantity(ingredient.id_ingredient) }}</td>
                <td class="px-6 py-4">{{ ingredient.calories }}</td>
                <td class="px-6 py-4"><button>Modifier</button></td>
                <td class="px-6 py-4"><button (click)="removeIngredient(i)">Supprimer</button></td>
            </tr>}
        </tbody>
    </table>
</div>
