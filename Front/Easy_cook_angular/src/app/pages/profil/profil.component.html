<div class="bg-white overflow-hidden shadow rounded-lg border">
  <div class="flex gap-6 mt-2 justify-center p-6">
    <h3 class="text-lg leading-6 font-medium text-gray-900">
      MON PROFIL
    </h3>
  </div>
  <div class="border-t border-gray-200 px-4 py-5 sm:p-0">
    <dl class="sm:divide-y sm:divide-gray-200">
      <div class="py-3 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
        <dt class="text-sm font-medium text-gray-500">
          Nom
        </dt>
        <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">
          Georgette
        </dd>
      </div>
      <div class="py-3 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
        <dt class="text-sm font-medium text-gray-500">
          Email
        </dt>
        <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">
         georgette&#64;gmail.fr
        </dd>
      </div>
      <div class="py-3 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
        <dt class="text-sm font-medium text-gray-500">
          Tél
        </dt>
        <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">
          0639075264
        </dd>
      </div>
      <div class="py-3 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
        <dt class="text-sm font-medium text-gray-500">
          Role
        </dt>
        <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">
          admin
        </dd>
      </div>
      <input type="button" value="Modifier mes infos" />
      <div class="flex gap-6 mt-2 justify-center p-6">
        <br>
      <h3 class="text-lg leading-6 font-medium text-gray-900">
        MES RECETTES PREFEREES
      </h3>
      </div>


      <div class="recettes-container">
        <div *ngFor="let recette of recettesFavorites" class="recette-card">
          <img [src]="recette.image" alt="{{recette.titre}}" class="recette-image">
          <div class="recette-titre">{{recette.titre}}</div>
        </div>
      </div>


    </dl>

  </div>

</div>
