<div>
    <a routerLink="/" class="p-4 font-sans hover:font-serif font-bold">Retour</a>
</div>

<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 ">
    <form class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm bg-slate-300 p-5 rounded-lg">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm bg-slate-300">
            <h2 class="mt-10 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">Inscrivez-vous pour accéder aux fonctionnalités</h2>
        </div>
        <div>
            <label class="block text-sm font-medium leading-6 text-gray-900" for="nom">Nom :</label>
            <input required class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" type="text" id="nom" formControlName="nom" placeholder="  Saisissez votre nom">
        </div>
        <div>
            <label class="block text-sm font-medium leading-6 text-gray-900" for="prenom">Prénom :</label>
            <input required class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" type="text" id="prenom" formControlName="prenom" placeholder="  Saisissez votre prénom">
        </div>
        <div>
            <label class="block text-sm font-medium leading-6 text-gray-900" for="email">Email :</label>
            <input required class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" type="text" id="email" formControlName="email" placeholder="  Saisissez votre adresse mail">
        </div>
        <div>
            <label class="block text-sm font-medium leading-6 text-gray-900" for="phone">Numéro de téléphone :</label>
            <input required class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" type="text" id="phone" formControlName="phone" placeholder="  Saisissez votre numéro de téléphone">
        </div>
        <div>
            <label class="block text-sm font-medium leading-6 text-gray-900" for="password">Mot de passe :</label>
            <input required class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" type="text" id="password" formControlName="password" placeholder="  Saisissez votre mot de passe">
        </div>
        <br>
        <div>
            <button class="flex w-full justify-center rounded-md bg-black px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-slate-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600" type="submit">Enregistrer</button>
        </div>
    </form>
</div>
